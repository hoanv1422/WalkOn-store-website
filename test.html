<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Chọn Sản Phẩm & Tính Tổng Giá</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #f4f4f4;
        }
        input[type="text"] {
            width: 150px;
            text-align: right;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>Giỏ hàng</h2>

    <table>
        <thead>
            <tr>
                <th><input type="checkbox" id="selectAll"></th>
                <th>Tên Sản Phẩm</th>
                <th>Giá</th>
                <th>Số Lượng</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><input type="checkbox" class="cartItemCheckbox" value="1" data-price="100000" data-quantity="2"></td>
                <td>Sản phẩm A</td>
                <td>100,000 VND</td>
                <td>2</td>
            </tr>
            <tr>
                <td><input type="checkbox" class="cartItemCheckbox" value="2" data-price="200000" data-quantity="1"></td>
                <td>Sản phẩm B</td>
                <td>200,000 VND</td>
                <td>1</td>
            </tr>
            <tr>
                <td><input type="checkbox" class="cartItemCheckbox" value="3" data-price="150000" data-quantity="3"></td>
                <td>Sản phẩm C</td>
                <td>150,000 VND</td>
                <td>3</td>
            </tr>
        </tbody>
    </table>

    <h3>Tổng tiền: <input type="text" id="totalPrice" name="totalPrice" value="0 VND" readonly></h3>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const selectAll = document.getElementById("selectAll");
            const checkboxes = document.querySelectorAll(".cartItemCheckbox");
            const totalPriceInput = document.getElementById("totalPrice");

            function updateTotalPrice() {
                let totalPrice = 0;

                checkboxes.forEach(checkbox => {
                    if (checkbox.checked) {
                        totalPrice += parseFloat(checkbox.dataset.price) * parseInt(checkbox.dataset.quantity);
                    }
                });

                totalPriceInput.value = new Intl.NumberFormat('vi-VN').format(totalPrice) + " VND";
            }

            selectAll.addEventListener("change", function() {
                checkboxes.forEach(checkbox => {
                    checkbox.checked = selectAll.checked;
                });
                updateTotalPrice();
            });

            checkboxes.forEach(checkbox => {
                checkbox.addEventListener("change", updateTotalPrice);
            });
        });
    </script>

</body>
</html>
