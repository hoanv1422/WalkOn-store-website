<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đánh Giá Sao</title>
    <link rel="stylesheet" 
          href="https://cdn.jsdelivr.net/npm/@mdi/font/css/materialdesignicons.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f8f9fa;
        }
        .rating-container {
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }
        .stars {
            font-size: 24px;
            color: #ffc107;
        }
        .review-count {
            color: gray;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="rating-container">
        <h2>Đánh Giá Trung Bình</h2>
        <div class="stars" id="rating-stars"></div>
        <div class="review-count">( 5,500 Khách hàng đánh giá )</div>
    </div>

    <script>
        function renderStars(rating) {
            let starsHtml = "";
            let fullStars = Math.floor(rating);
            let halfStar = (rating - fullStars) >= 0.5 ? 1 : 0;
            let emptyStars = 5 - (fullStars + halfStar);

            for (let i = 0; i < fullStars; i++) {
                starsHtml += `<span class="mdi mdi-star text-warning"></span>`;
            }
            if (halfStar) {
                starsHtml += `<span class="mdi mdi-star-half-full text-warning"></span>`;
            }
            for (let i = 0; i < emptyStars; i++) {
                starsHtml += `<span class="mdi mdi-star-outline text-warning"></span>`;
            }

            document.getElementById("rating-stars").innerHTML = starsHtml;
        }

        // Hiển thị số sao với giá trị mặc định (ví dụ: 4.2)
        renderStars(1);
    </script>

</body>
</html>
