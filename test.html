<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Modal Giỏ Hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

    <div class="container mt-5">
        <!-- Nút mở modal -->
        <button type="button" class="cart-btn btn btn-primary" title="Add to cart" data-bs-toggle="modal" data-bs-target="#cartModal">
            Thêm vào giỏ hàng
        </button>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="cartModal" tabindex="-1" aria-labelledby="cartModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="cartModalLabel">Chọn sản phẩm</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="d-flex">
                        <!-- Ảnh sản phẩm -->
                        <img src="https://via.placeholder.com/150" alt="Ảnh sản phẩm" class="img-fluid me-3" style="width: 150px;">
                        
                        <!-- Thông tin sản phẩm -->
                        <div>
                            <h5 id="product-name">Tên sản phẩm</h5>
                            <p id="product-price">Giá: 500.000đ</p>

                            <!-- Chọn biến thể -->
                            <label for="variant">Chọn biến thể:</label>
                            <select id="variant" class="form-select">
                                <option value="128GB-Đỏ">128GB - Đỏ</option>
                                <option value="256GB-Xanh">256GB - Xanh</option>
                            </select>

                            <!-- Chọn số lượng -->
                            <label for="quantity" class="mt-2">Số lượng:</label>
                            <input type="number" id="quantity" class="form-control" value="1" min="1">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                    <button type="button" class="btn btn-primary">Thêm vào giỏ hàng</button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
