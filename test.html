<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address Selection Modal</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }

        .modal-header-1 {
            padding: 16px;
            background-color: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 500;
            color: #333;
        }

        .modal-body {
            padding: 16px;
            max-height: 60vh;
            overflow-y: auto;
        }

        .address-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .d-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            background-color: #fff;
            transition: background-color 0.2s ease;
        }

        .d-flex:hover {
            background-color: #f5f5f5;
        }

        .d-flex > div:first-child {
            cursor: pointer;
            flex: 1;
        }

        .d-flex > div:first-child strong {
            font-size: 16px;
            color: #333;
            display: block;
            margin-bottom: 4px;
        }

        .d-flex > div:first-child span {
            font-size: 14px;
            color: #666;
        }

        .d-flex > div:last-child {
            display: flex;
            gap: 8px;
        }

        .d-flex button {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .d-flex button:first-child {
            background-color: #007bff;
            color: #fff;
        }

        .d-flex button:first-child:hover {
            background-color: #0056b3;
        }

        .d-flex button:last-child {
            background-color: #dc3545;
            color: #fff;
        }

        .d-flex button:last-child:hover {
            background-color: #b02a37;
        }

        .modal-footer {
            padding: 12px 16px;
            border-top: 1px solid #dee2e6;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .btn {
            padding: 8px 16px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Delivery Address Selector</h2>
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addressModal">
            Open Address Modal
        </button>
    </div>

    <!-- Address Selection Modal -->
    <div class="modal fade" id="addressModal" tabindex="-1" aria-labelledby="addressModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header-1">
                    <h5 class="modal-title" id="addressModalLabel">Chọn Địa Chỉ Giao Hàng</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="address-list" id="addressList">
                        <!-- Sample address items (replacing @foreach) -->
                        <div class="d-flex">
                            <div data-address="123 Main St, City, Country" data-lat="40.7128" data-lon="-74.0060" onclick="selectAddress(this)">
                                <strong>Home</strong><br>
                                <span>123 Main St, City, Country</span>
                            </div>
                            <div>
                                <button class="">Sửa</button>
                                <button class="">Xóa</button>
                            </div>
                        </div>
                        <div class="d-flex">
                            <div data-address="456 Oak Ave, Town, Country" data-lat="35.6762" data-lon="139.6503" onclick="selectAddress(this)">
                                <strong>Work</strong><br>
                                <span>456 Oak Ave, Town, Country</span>
                            </div>
                            <div>
                                <button class="">Sửa</button>
                                <button class="">Xóa</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addAddressModal" onclick="hideAddressModal()">Thêm mới</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-primary" onclick="confirmAddress()">Xác nhận</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Placeholder for Add Address Modal (not implemented) -->
    <div class="modal fade" id="addAddressModal" tabindex="-1" aria-labelledby="addAddressModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header-1">
                    <h5 class="modal-title" id="addAddressModalLabel">Thêm Địa Chỉ Mới</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>Form to add a new address (not implemented).</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-primary">Lưu</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS and Popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
    <script>
        let selectedAddress = null;

        function selectAddress(element) {
            // Remove active class from all address items
            document.querySelectorAll('.d-flex').forEach(item => {
                item.classList.remove('active');
            });

            // Add active class to selected item
            element.parentElement.classList.add('active');

            // Store selected address data
            selectedAddress = {
                address: element.getAttribute('data-address'),
                lat: element.getAttribute('data-lat'),
                lon: element.getAttribute('data-lon')
            };

            // Optional: Visual feedback for selection
            element.querySelector('strong').style.color = '#007bff';
        }

        function confirmAddress() {
            if (selectedAddress) {
                alert(`Confirmed Address: ${selectedAddress.address}\nLatitude: ${selectedAddress.lat}\nLongitude: ${selectedAddress.lon}`);
                // Close the modal
                const modal = bootstrap.Modal.getInstance(document.getElementById('addressModal'));
                modal.hide();
            } else {
                alert('Please select an address first.');
            }
        }

        function hideAddressModal() {
            const modal = bootstrap.Modal.getInstance(document.getElementById('addressModal'));
            modal.hide();
        }
    </script>
    <style>
        .d-flex.active {
            border-color: #007bff;
            background-color: #e7f1ff;
        }
    </style>
</body>
</html>
