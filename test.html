<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tích hợp VietnamProvinces và GraphHopper</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        select { padding: 8px; margin: 5px; width: 200px; }
        #coordinates { margin-top: 10px; }
    </style>
</head>
<body>
    <h2>Chọn địa chỉ và lấy tọa độ</h2>
    <div>
        <label for="province">Tỉnh/Thành:</label>
        <select id="province" onchange="loadDistricts()">
            <option value="">-- Chọn Tỉnh/Thành --</option>
        </select>
    </div>
    <div>
        <label for="district">Quận/Huyện:</label>
        <select id="district" onchange="loadWards()" disabled>
            <option value="">-- Chọn Quận/Huyện --</option>
        </select>
    </div>
    <div>
        <label for="ward">Phường/Xã:</label>
        <select id="ward" onchange="getCoordinates()" disabled>
            <option value="">-- Chọn Phường/Xã --</option>
        </select>
    </div>
    <div id="coordinates">Tọa độ: <span id="latlon"></span></div>

    <script>
        const GRAPH_HOPPER_API_KEY = "8c5e66d0-53b9-4218-af36-3223f27769ec"; // Thay bằng API key của bạn

        // Load danh sách tỉnh/thành từ provinces.open-api.vn
        async function loadProvinces() {
            const provinceSelect = document.getElementById("province");
            try {
                const response = await fetch("https://provinces.open-api.vn/api/p/");
                const provinces = await response.json();
                provinces.forEach(prov => {
                    const option = document.createElement("option");
                    option.value = prov.code;
                    option.text = prov.name;
                    provinceSelect.appendChild(option);
                });
            } catch (error) {
                console.error("Lỗi khi tải tỉnh/thành:", error);
            }
        }

        // Load quận/huyện
        async function loadDistricts() {
            const provinceCode = document.getElementById("province").value;
            const districtSelect = document.getElementById("district");
            const wardSelect = document.getElementById("ward");

            districtSelect.innerHTML = '<option value="">-- Chọn Quận/Huyện --</option>';
            wardSelect.innerHTML = '<option value="">-- Chọn Phường/Xã --</option>';
            districtSelect.disabled = true;
            wardSelect.disabled = true;

            if (provinceCode) {
                try {
                    const response = await fetch(`https://provinces.open-api.vn/api/p/${provinceCode}?depth=2`);
                    const data = await response.json();
                    const districts = data.districts;
                    districts.forEach(dist => {
                        const option = document.createElement("option");
                        option.value = dist.code;
                        option.text = dist.name;
                        districtSelect.appendChild(option);
                    });
                    districtSelect.disabled = false;
                } catch (error) {
                    console.error("Lỗi khi tải quận/huyện:", error);
                }
            }
        }

        // Load phường/xã
        async function loadWards() {
            const districtCode = document.getElementById("district").value;
            const wardSelect = document.getElementById("ward");

            wardSelect.innerHTML = '<option value="">-- Chọn Phường/Xã --</option>';
            wardSelect.disabled = true;

            if (districtCode) {
                try {
                    const response = await fetch(`https://provinces.open-api.vn/api/d/${districtCode}?depth=2`);
                    const data = await response.json();
                    const wards = data.wards;
                    wards.forEach(ward => {
                        const option = document.createElement("option");
                        option.value = ward.code;
                        option.text = ward.name;
                        wardSelect.appendChild(option);
                    });
                    wardSelect.disabled = false;
                } catch (error) {
                    console.error("Lỗi khi tải phường/xã:", error);
                }
            }
        }

        // Lấy tọa độ từ GraphHopper Geocoding API
        async function getCoordinates() {
            const province = document.getElementById("province").options[document.getElementById("province").selectedIndex].text;
            const district = document.getElementById("district").options[document.getElementById("district").selectedIndex].text;
            const ward = document.getElementById("ward").options[document.getElementById("ward").selectedIndex].text;
            const query = `${ward}, ${district}, ${province}, Vietnam`;

            try {
                const response = await fetch(
                    `https://graphhopper.com/api/1/geocode?q=${encodeURIComponent(query)}&key=${GRAPH_HOPPER_API_KEY}`
                );
                const data = await response.json();
                if (data.hits && data.hits.length > 0) {
                    const { lat, lng } = data.hits[0].point;
                    document.getElementById("latlon").textContent = `Lat: ${lat}, Lon: ${lng}`;
                } else {
                    document.getElementById("latlon").textContent = "Không tìm thấy tọa độ";
                }
            } catch (error) {
                console.error("Lỗi khi lấy tọa độ:", error);
                document.getElementById("latlon").textContent = "Lỗi khi lấy tọa độ";
            }
        }

        // Khởi tạo
        window.onload = loadProvinces;
    </script>
</body>
</html>
