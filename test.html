<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Avatar Image with Bootstrap</title>
    <!-- Liên kết với Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Đảm bảo hình ảnh trong avatar có object-fit: cover */
        .avatar-img {
            object-fit: cover;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div class="container mt-5">
        <!-- Sử dụng lớp avatar để tạo hình tròn và giới hạn kích thước -->
        <div class="avatar-title bg-light rounded-circle overflow-hidden" style="width: 100px; height: 100px;">
            <!-- Hình ảnh -->
            <img src="public/img/logo.png" alt="Product Image" class="avatar-img">
        </div>
    </div>

    <!-- Liên kết với Bootstrap JS (nếu cần) -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
